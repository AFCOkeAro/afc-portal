# AFC Church Portal — CI
#
# Three gate families today. The static gates were required to land in the FIRST
# commit that carried the retention work, not after it: a gate added later is a
# gate that gets commented out (AFC-168 AC6).
#
# 1. retention-literal gate  -- static. Proves no retention period is hardcoded
#    outside the config layer. AFC-167 / ADR-159-2 require retention to be
#    config-driven.
# 2. awareness write-context gate -- static. Proves incidents.awareness_at is
#    never named in application source: no payload, no DTO, no type, no Flow.
#    The database sets that column; source that names it is source that can
#    write it. AFC-166 AC5.
# 3. database control tests  -- behavioural. Proves the incidents.awareness_at
#    controls actually hold (AFC-166 / ADR-159-2 D7).
#
# And, since AFC-174, the application checks from repo-plan section 4 steps 1-3:
# lint + format, typecheck, build. Steps 4-7 (unit tests, permission matrix,
# schema drift, accessibility) are still missing and are listed as a TODO at the
# bottom of this file rather than being quietly absent.
#
# The gate script self-tests on every run. A gate nobody has watched fail is
# untested, not enforced, so the self-test is part of the pipeline rather than a
# one-off manual check.

name: ci

# Least privilege. This workflow only ever reads the repository: it checks out
# code and installs dependencies. It publishes nothing and opens no PR. The
# default GITHUB_TOKEN can be broader than read on older repos, so it is
# narrowed here rather than inherited.
permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # 0. COMPLIANCE-PATH DIRTY GUARD. AFC-175. Runs FIRST, and the other jobs
  #    declare `needs:` on it, because a dirty compliance path invalidates
  #    every result downstream of it. Spending four minutes on a build and a
  #    database suite in order to then fail on "you never committed that" is the
  #    expensive ordering, not the safe one.
  #
  #    WHY THIS IS ITS OWN JOB AND NOT A STEP. The other gates answer "is the
  #    code in this tree correct". This one answers "is the code in this tree
  #    attributable" -- which is a different question, needs no dependency
  #    install, and must not be reachable only after an install can fail. If
  #    this job cannot run, the answer it exists to give is not available, and
  #    a green pipeline would then be asserting enforcement on an unknown tree.
  #
  #    NOTE ON WHERE IT BITES. On a fresh actions/checkout this job passes by
  #    construction, because uncommitted work does not travel in a commit. It
  #    is load-bearing in every environment where the working tree is SHARED,
  #    which is how every agent in this company works. Read it as "certifies the
  #    tree it was handed", not as a substitute for review.
  #
  #    AFC-174 added lint/typecheck/build below. They are not listed in `needs:*
  #    here on purpose: that job owns this file next, and it should add the
  #    edges itself rather than have them appear under its diff.
  #
  #    AFC-210 added --check-commit below. Until it landed, the dirty-tree mode
  #    above was the only half of this guard CI ever ran, and the half that
  #    measures committed history -- R2 itself -- had never executed in a
  #    pipeline at any point. A gate nobody's CI calls is a tool, not a
  #    control, and R4 was claiming coverage it did not have. This step is what
  #    makes the R4 claim true for R2.
  # --------------------------------------------------------------------------
  dirty-path-guard:
    name: Compliance-path dirty guard
    runs-on: ubuntu-latest
    steps:
      # Full history, deliberately. --check-commit answers questions about
      # commits, and actions/checkout defaults to fetch-depth: 1, which leaves
      # exactly one commit to inspect. A provenance check that can only see the
      # tip is a check on the tip, not on the provenance.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Dirty-path guard self-test (a guard must be able to fail)
        run: bash scripts/dirty-path-guard.sh --self-test

      - name: Compliance-path dirty guard
        run: bash scripts/dirty-path-guard.sh

      # R1 and R2 over the range this event actually introduced: on a
      # pull_request that is the PR's own commits, on a push to main the commits
      # the push added. Checking all of main every run would be slower each time
      # and would re-report settled history as if it were new.
      #
      # EXPECTED RED WHILE R1 IS OPEN, and deliberately not `continue-on-error`.
      # Measured against full history with the corrected guard (f64cc7d):
      # eight compliance-path commits, 22 violations -- 19 R1 across seven
      # commits, and 3 R2. The R2 3 are 1f43c9e, 3cb6b0a and 876d1f6; the other
      # five are closed (three grandfathered with the reason printed on every
      # run, two by AFC-197 review records). R1 is untouched by that ruling and
      # the R1 debt belongs to the AFC-195 fence owner rather than to the
      # decision that exposed it.
      #
      # The counts above were wrong until f64cc7d and are corrected here. Until
      # that commit this step passed two arguments, the dispatcher put the
      # second in the REV slot, git could not resolve it, and the step exited 2
      # before reading one commit -- so this comment described a run that had
      # never actually happened.
      #
      # It is left failing rather than made advisory on purpose. A gate
      # configured so its failure is ignorable trains the team to scroll past it,
      # which is how a control stops existing while still appearing in the
      # pipeline. An honestly red gate gets fixed.
      - name: Compliance-path commit provenance (R1 claim, R2 reviewer)
        run: |
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            range="${{ github.event.pull_request.base.sha }}..HEAD"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            range="${{ github.event.before }}..HEAD"
          else
            range=HEAD
          fi
          echo "provenance check over $range"
          # ONE argument, as usage: documents. f64cc7d corrected the dispatcher
          # to pass (ROOT, REV) in the order check_commit() declares, so $2 is
          # the REV and the old second argument here landed in the REV slot,
          # where git could not resolve it and the step failed closed with
          # exit 2 before reading a single commit. ROOT_DEFAULT is derived from
          # BASH_SOURCE (scripts/dirty-path-guard.sh:214), so it is already the
          # workspace root and needs no argument.
          bash scripts/dirty-path-guard.sh --check-commit "$range"

  retention-gate:
    name: Retention literal gate
    needs: [dirty-path-guard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gate self-test (a gate must be able to fail)
        run: |
          bash scripts/awareness-write-context-gate.sh --self-test
          bash scripts/retention-literal-gate.sh --self-test
          bash scripts/migration-privilege-gate.sh --self-test
          node scripts/migration-rollback-gate.mjs --self-test

      - name: Awareness write-context gate
        run: bash scripts/awareness-write-context-gate.sh

      - name: Retention literal gate
        run: bash scripts/retention-literal-gate.sh

      # ADR-0002. A migration may GRANT and REVOKE; it may never CREATE ROLE.
      # Roles are provisioned by the cluster-owner bootstrap step before the
      # sequence. The reason this is not fixed by granting CREATEROLE to the
      # migrator is that CREATEROLE lets the migration identity promote itself
      # to directus_app and escalate to full read/write on the app database.
      - name: Migration privilege boundary gate
        run: bash scripts/migration-privilege-gate.sh

      # AFC-266. A migration's down script must not remove a control whose
      # referent survives it without restoring that control. This is the AFC-253
      # class: reversing the clock migration disarmed the NDPA s.40(2) breach
      # register, and every forward-state suite read green because a rollback is
      # not a state any test asserted.
      #
      # Left failing rather than advisory for the same reason as the R2 step
      # above: a gate whose failure is ignorable trains the team to scroll past
      # it. It currently reports one real finding in
      # rollback/20261006_0005_retention_attribution.down.sql.
      - name: Migration rollback control gate
        run: node scripts/migration-rollback-gate.mjs

  db-tests:
    name: Database control tests (awareness_at)
    needs: [dirty-path-guard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Order matters and is not cosmetic. setup-node's `cache: pnpm` resolves
      # pnpm from PATH, and the action's own contract is "Package manager
      # should be pre-installed" -- so pnpm/action-setup has to run FIRST.
      # The other way round the cache step cannot find a package manager.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # pnpm-lock.yaml is committed. setup-node keys the cache on that file's
      # hash, and a suite that is legal evidence for a compliance control has to
      # resolve the same transitive dependency tree every run. An unpinned
      # resolve makes a green run non-reproducible.
      - name: Install
        run: pnpm install --frozen-lockfile

      # PGlite gives a real Postgres 16 engine with no service container, so the
      # control tests exercise the same trigger and privilege semantics they
      # will meet in staging.

      # AFC-203. The assertion ledger self-test, and it runs FIRST in this job.
      #
      # It belongs here rather than beside the shell gate self-tests above
      # because it needs an engine: it installs the real harness and forces an
      # assertion to fail, then asserts the ledger reports that failure. That is
      # the regression net for the defect where a failing suite persisted zero
      # assertion rows, so the summary line's "0 failing" was a tautology rather
      # than a measurement -- a harness that cannot report a failure will
      # eventually be tuned until it reports a pass.
      #
      # A gate nobody has watched fail is untested, not enforced.
      - name: Assertion ledger self-test (the instrument must be able to fail)
        run: node scripts/run-db-tests.mjs --self-test

      - name: Run database control tests
        run: pnpm test:db

      # AFC-202. The same tree again in a session that is NOT UTC.
      #
      # WHY A SECOND RUN IS THE POINT, NOT THE PIN. The runner pins the session
      # TimeZone to UTC so a suite asserting on a *rendering* checks the same
      # thing everywhere. A pin hides exactly the defect AFC-202 was: four
      # backfill assertions compared a timestamptz rendered with ::text against
      # literals pinned to '+00', so they held only on a UTC session -- and
      # ubuntu-latest is UTC, so CI was green by accident of the runner's clock.
      # For an NDPA s.40(2) legal-evidence control that is the evidence being
      # right for the wrong reason.
      #
      # This step is the regression net for that: it sets the session TimeZone
      # to Africa/Lagos, so any future assertion that compares a rendering to a
      # UTC-pinned literal goes red here even though the job above stays green.
      # The assertions must be correct with this run, not because of the pin.
      - name: Run database control tests in a non-UTC session
        run: pnpm test:db
        env:
          DB_TEST_TIMEZONE: Africa/Lagos

  # TODO(CTO): also run this suite against a real postgres:16 service
  # container. PGlite is PostgreSQL 16 compiled to WebAssembly; the trigger
  # and privilege semantics are the same, but "same engine, same wasm
  # runtime" is not the same claim as "same engine, same binary", and this
  # is a P1 legal-evidence control. Tracked with AFC-166.

  # --------------------------------------------------------------------------
  # Design-system static gates. AFC-199.
  #
  # WHY THIS IS ITS OWN JOB. It needs no dependency install, no database and no
  # browser -- it is one source scan and one CSS invariant, so it runs in
  # seconds and cannot be hidden behind an install failure. It is also the only
  # mechanical control over a component contract that the stylesheet cannot
  # enforce by itself: the design system ships no JavaScript, so nothing in the
  # CSS can refuse a consuming app that writes `aria-selected` on an anchor-nav
  # link. The tab-role gate is that refusal.
  #
  # The self-test runs first, for the same reason every other gate here
  # self-tests: a gate nobody has watched fail is untested, not enforced.
  # --------------------------------------------------------------------------
  design-system-gates:
    name: Design-system tab-role gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tab-role gate self-test (the gate must be able to fail)
        run: node design-system/tools/tab-role-check.mjs --self-test

      # Fails when a `.afc-tab` carries `aria-selected` without `role="tab"`,
      # i.e. the selected-state hook was put on a link, and when the CSS no
      # longer pairs the aria-selected and aria-current active-state rules in
      # one declaration block.
      - name: Tab-role gate (no aria-selected on an .afc-tab link)
        run: node design-system/tools/tab-role-check.mjs

  # --------------------------------------------------------------------------
  # repo-plan section 4, steps 1-3. Added by AFC-174, the first commit with
  # application source to lint.
  #
  # These three are separate jobs rather than three steps in one job on purpose:
  # a format failure should not hide a typecheck failure, and a broken build
  # should be visible without reading a log that also contains lint output for
  # forty unrelated files. They share an identical install preamble, which is
  # also identical to db-tests' — if the order of pnpm/action-setup and
  # setup-node ever changes, it changes in all four.
  # --------------------------------------------------------------------------

  lint-format:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      # Format before lint, and both before anything that reads the tree: a
      # formatting disagreement reported by eslint and the same disagreement
      # reported by prettier are two failures for one cause.
      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      # packages/shared is checked on its own tsconfig, not through the Nuxt
      # one. It is also imported by the server routes, so a type error in it is
      # a type error in the portal; catching it in the small package first gives
      # a readable message instead of a Nuxt-generated one.
      - name: Typecheck shared package
        run: pnpm --filter @afc/shared typecheck

      # `nuxt typecheck` needs vue-tsc, which lives in the app's devDependencies.
      # Nuxt's postinstall has already generated .nuxt/tsconfig.json by this
      # point, which is why this cannot be the first command after install.
      - name: Typecheck web app
        run: pnpm --filter web typecheck

  build:
    name: Build (pnpm --filter web build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # Node's default heap is under what a full Nuxt production build needs on
      # a two-core runner. Raising it here rather than in a config file, because
      # a heap flag committed to package.json would change local builds too.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter web build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      # A build that emits nothing is not a build. Nitro's server entry is the
      # artefact the Dockerfile copies, so asserting its existence here is what
      # makes the build step load-bearing rather than advisory.
      - name: Assert the build produced a server bundle
        run: test -f apps/web/.output/server/index.mjs

  # TODO(CTO): the rest of repo-plan section 4.
  #   step 4  unit tests (composables, shared zod schemas, Flow logic)
  #   step 5  permission tests against an ephemeral Directus + Postgres
  #   step 6  schema drift against services/directus/schema/snapshot.yaml
  #   step 7  accessibility (axe on the public pages)
  # Step 5 is the one that matters most: until it runs, the capability list in
  # packages/shared/src/role-matrix.ts is a transcription of the data-model §10
  # table and nothing has checked it against the Directus policies that are
  # supposed to implement it. Do not mark this file "complete" until steps 4-7
  # exist.
