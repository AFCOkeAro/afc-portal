# NDPA s.40(2) breach clock — alert rules
#
# The timestamp exists so that a clock gets watched. A clock that lives only in
# the breach register document is a spreadsheet, not a control (AFC-166 §6).
#
# Source of truth for the numbers: the `incidents_breach_clock` view created by
# services/directus/schema/migrations/20261006_0002_incidents_awareness_at.sql
# and the exporter queries beside this file.
#
# Thresholds, and why:
#   60h remaining — leaves a working day plus overnight inside the 72h window,
#                   so the alert lands while there is still time to act.
#    0h remaining — the breach was not notified in time. This is not a warning,
#                   it is a reportable incident in its own right.
#   schema probe — the readiness check. 1 when the clock columns exist, 0
#                   when the migration is missing or regressed. A 0 pages the
#                   same on-call path, because without the columns no deadline
#                   can be computed at all. (AFC-255 Finding 2: the two
#                   per-row NULL canaries this replaces could never fire.)
#
# Routing: both the 60h and the 0h alerts must reach the on-call path in the
# 72-hour runbook owned by AFC-163. This file does not own the runbook; it names
# the contract. If AFC-163's runbook does not exist yet, these alerts are
# unroutable and that is a known open gap, not a silent one.

groups:
  - name: ndpa-breach-clock
    interval: 5m
    rules:
      - alert: NdpaSchemaAwarenessAtMissing
        expr: ndpa_schema_awareness_at_present == 0
        for: 1m
        labels:
          severity: page
          control: ndpa-s40-2
        annotations:
          summary: >-
            The NDPA s.40(2) clock columns are absent on this database — the
            migration is not applied or the schema has regressed.
          description: >-
            ndpa_schema_awareness_at_present is 0, meaning incidents is missing
            awareness_at, awareness_at_source, or the table itself. The probe
            uses to_regclass so it emits 0 instead of erroring, which is what
            makes this alert reachable: the two alerts it replaces
            (NdpaBreachClockOriginMissing / NdpaBreachProvenanceMissing)
            queried `WHERE awareness_at IS NULL`, a condition the NOT NULL
            constraint makes unreachable, and errored without emitting a
            series when the migration was missing — an absent series never
            fires (AFC-255 Finding 2). Until this is fixed, no 72-hour
            deadline can be computed. Treat as a broken migration, not as a
            data question.
          runbook: AFC-163 72-hour notification runbook
          runbook_url: /AFC/issues/AFC-163

      - alert: NdpaBreachClockWarning
        # 60 hours remaining = 12 hours consumed of the 72.
        expr: ndpa_breach_clock_remaining_hours <= 60
          and ndpa_breach_clock_remaining_hours > 0
        for: 5m
        labels:
          severity: page
          control: ndpa-s40-2
        annotations:
          summary: >-
            {{ $labels.ref }}: {{ $value | printf "%.1f" }}h left on the NDPA
            s.40(2) clock (aware {{ $labels.awareness_at }}).
          description: >-
            Two thirds of the window remain. If notification has not been
            prepared, start it now. awareness_at is when the church became
            aware — detected_at ({{ $labels.detected_at }}) is deliberately not
            used for this deadline and may be later.
          runbook: AFC-163 72-hour notification runbook
          runbook_url: /AFC/issues/AFC-163

      - alert: NdpaBreachClockBreached
        expr: ndpa_breach_clock_remaining_hours <= 0
        for: 1m
        labels:
          severity: page
          control: ndpa-s40-2
        annotations:
          summary: >-
            {{ $labels.ref }}: the 72-hour window has closed with
            {{ $value | printf "%.1f" }}h still owed (aware
            {{ $labels.awareness_at }}).
          description: >-
            Notification was not made inside the window. This is a
            reportable failure in its own right: record what happened and when
            in the incident row. Do not edit awareness_at — the remediation for a
            wrong clock origin is a new incident row referencing this one, which
            keeps both records. editing it destroys the only evidence of when the
            church became aware.
          runbook: AFC-163 72-hour notification runbook
          runbook_url: /AFC/issues/AFC-163