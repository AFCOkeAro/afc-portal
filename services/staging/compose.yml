# AFC Church Portal — staging deploy bundle (AFC-385).
#
# SCOPE: staging only. Web (Nuxt SSR) + Caddy. No postgres, no Directus yet.
# Parent: AFC-383 (board chose VPS). Sibling: AFC-384 (build verification).
# Spec: docs/planning/infra-spec.md sections 2 and 4; image: apps/web/Dockerfile.
#
# Production compose (services/directus/compose.yml) is untouched by design.
# This file is a snippet the operator copies onto a fresh VPS next to the
# staging Caddyfile and staging .env in this directory.
#
# NAMES ONLY. Every environment value is a `${VAR}` reference resolved from
# services/staging/.env on the host (mode 600, git-ignored). No secret value
# and no real domain appears in this file or in any other committed file.
# A real value here would be a secret committed to a repository that will
# hold children's records.

services:
  web:
    # Built from the workspace root (apps/web/Dockerfile needs
    # pnpm-workspace.yaml, the root lockfile and packages/shared).
    # On the VPS the operator copies the repo or builds the image in CI
    # (AFC-384) and sets WEB_IMAGE to the published tag instead.
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      # Staging SHA-proof (AFC-718): the commit SHA is baked into the image
      # at build time. Set NUXT_PUBLIC_BUILD_SHA in the host .env (or leave
      # it empty for local builds, where the probe reports 'unknown').
      args:
        NUXT_PUBLIC_BUILD_SHA: ${NUXT_PUBLIC_BUILD_SHA:-}
    image: ${WEB_IMAGE:-afc-web:staging}
    restart: unless-stopped
    # Zero-downtime staging deploys: SIGTERM must drain in-flight
    # requests (notably the Directus refresh reseal) instead of
    # cutting them. Caddy retries while the replacement boots.
    stop_grace_period: 60s
    environment:
      # Staging serves the real auth path stub-OFF. See .env.example.
      NUXT_STUB_AUTH: ${NUXT_STUB_AUTH:-false}
      NUXT_SESSION_SECRET: ${NUXT_SESSION_SECRET}
      # Directus is not deployed yet: leave all four empty. The app is
      # degraded-safe — GET /api/health still answers 200 with
      # directusConfigured:false; login and public registration answer 503
      # with a message that says Directus is not deployed.
      NUXT_DIRECTUS_URL: ${NUXT_DIRECTUS_URL:-}
      NUXT_PUBLIC_DIRECTUS_URL: ${NUXT_PUBLIC_DIRECTUS_URL:-}
      NUXT_DIRECTUS_SERVER_TOKEN: ${NUXT_DIRECTUS_SERVER_TOKEN:-}
      NUXT_DIRECTUS_PUBLIC_TOKEN: ${NUXT_DIRECTUS_PUBLIC_TOKEN:-}
      # AFC-1256: server-only create-only writer token. Without it the new
      # registration route fails closed with 503 registration_writer_unavailable.
      NUXT_DIRECTUS_WRITER_TOKEN: ${NUXT_DIRECTUS_WRITER_TOKEN:-}
      # AFC-1256: Turnstile secret. Without it NODE_ENV=production fails
      # closed with 503 bot_verification_unavailable before any seat work.
      NUXT_TURNSTILE_SECRET_KEY: ${NUXT_TURNSTILE_SECRET_KEY:-}
      # AFC-1250: Flow-triggered ticket email transport. The SMTP values are
      # the same mailbox Directus uses; the flow secret is server-only.
      NUXT_SMTP_HOST: ${EMAIL_SMTP_HOST:-}
      NUXT_SMTP_PORT: ${EMAIL_SMTP_PORT:-}
      NUXT_SMTP_USER: ${EMAIL_SMTP_USER:-}
      NUXT_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-}
      NUXT_SMTP_SECURE: ${EMAIL_SMTP_SECURE:-}
      NUXT_TICKET_FLOW_SECRET: ${NUXT_TICKET_FLOW_SECRET:-}
      NUXT_TICKET_FROM: ${NUXT_TICKET_FROM:-}
      # Staging SHA-proof (AFC-718): runtime fallback for the build SHA the
      # image baked in above. Resolves from the host .env, same as every
      # other entry in this block; empty means the probe reports 'unknown'.
      NUXT_PUBLIC_BUILD_SHA: ${NUXT_PUBLIC_BUILD_SHA:-}
      # Admin-surface only (AFC-669 roles/permissions management): the portal
      # server logs in as the Directus administrator for role/policy reads
      # and writes. Names only here; values resolve from services/staging/.env
      # on the host, same as every other entry in this block.
      DIRECTUS_ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL:-}
      DIRECTUS_ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD:-}
      # Legal-hold release path (AFC-243): connection string for the
      # dedicated legal_hold_releaser role. Provisioned out of band in
      # services/staging/.env (mode 600, git-ignored), never in the repo.
      # Absent means POST /api/legal-holds/:id/release answers 503.
      NUXT_LEGAL_HOLD_DATABASE_URL: ${NUXT_LEGAL_HOLD_DATABASE_URL:-}
      # Demo seed/clear path (AFC-1086): connection string for the demo
      # seed/clear identity. Staging-only: provisioned out of band in
      # services/staging/.env (mode 600, git-ignored), never in the repo.
      # Uses the afc_portal role (superuser on the staging database only),
      # which is migrator-capable for the seed/clear scripts plus the audit
      # row. Absent means POST /api/admin/demo/seed|clear answers 503.
      # Never configure this in production.
      NUXT_DEMO_DATABASE_URL: ${NUXT_DEMO_DATABASE_URL:-}
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
    volumes:
      # Demo seed scripts beside the server (AFC-1086): the demo routes load
      # services/directus/seeds/demo/*.sql from beside the server and refuse
      # with 503 when absent. Mounts the reviewed scripts read-only from the
      # deploy checkout; the server never writes here.
      - ../../services/directus/seeds/demo:/app/services/directus/seeds/demo:ro
    expose:
      - '3000'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:3000/api/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    # AFC-1217: custom Caddy build with the rate_limit module.
    # Rollback: comment the build block + afc-caddy image line, uncomment
    # the stock image line, and restore the pre-AFC-1217 Caddyfile.
    build:
      context: ../..
      dockerfile: services/staging/Dockerfile.caddy
    image: afc-caddy:staging
    # image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_started
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
