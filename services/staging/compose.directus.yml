# AFC Church Portal — staging Directus overlay.
# Adds Postgres + Directus to the web-only staging bundle for preview login.
# Staging only. No production data, no youth data.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # Cluster-owner identity: owns roles/bootstrap and provides the
      # healthcheck + migrator path. Never the Directus runtime identity.
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - directus_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  directus:
    image: directus/directus:11
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Least privilege (AFC-535): Directus stays internal-only. The web
    # container reaches it over the overlay network at http://directus:8055,
    # so no host publish is needed for the app path. The loopback publish
    # below exists only so the operator can open the admin UI over SSH
    # (`ssh -L 8055:127.0.0.1:8055 <vps>`). Publishing 8055 to the host
    # network (bare "8055:8055") or routing it through Caddy requires an
    # explicit CTO sign-off — do not do it for first boot.
    ports:
      - "127.0.0.1:8055:8055"
    healthcheck:
      # Mirrors the web healthcheck style (node fetch, no curl dependency).
      # start_period covers cold-start schema migration on first boot.
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8055/server/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    environment:
      KEY: ${DIRECTUS_KEY}
      SECRET: ${DIRECTUS_SECRET}
      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB}
      # Least privilege (AFC-749): Directus connects as directus_app (LOGIN,
      # owns nothing), provisioned by bootstrap/0001_roles.sql. The
      # POSTGRES_* owner identity above is the migrator/healthcheck path
      # only — it must never be the Directus runtime identity, or the
      # migration suite's column-level grant model (0013, 0033) is
      # unenforced on staging.
      DB_USER: ${DIRECTUS_DB_USER}
      DB_PASSWORD: ${DIRECTUS_DB_PASSWORD}
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD}
      PUBLIC_URL: ${DIRECTUS_PUBLIC_URL}
      STORAGE_LOCATIONS: local
      STORAGE_LOCAL_DRIVER: local
      STORAGE_LOCAL_ROOT: /directus/uploads
      RATE_LIMITER_ENABLED: "true"
      TELEMETRY: "false"
    volumes:
      - directus_uploads:/directus/uploads

  web:
    # service_healthy (not service_started): the acceptance flag
    # directusConfigured is config-only (non-empty NUXT_DIRECTUS_URL, no
    # fetch), so service_started would be enough for that one flag — but
    # sign-in and registration actually fetch Directus, and without this
    # gate web serves 503/502s against a still-migrating Directus.
    depends_on:
      directus:
        condition: service_healthy

volumes:
  directus_pgdata:
  directus_uploads:
