<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Campus groups — AFC Church Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../../../design-system/tokens/afc-tokens.css" />
<link rel="stylesheet" href="../../../design-system/components/afc-components.css" />
<link rel="stylesheet" href="../../../design-system/components/afc-resilient-states.css" />
</head>
<body class="afc">
<a class="afc-skip-link" href="#main">Skip to content</a>

<header class="afc-topbar">
  <span class="afc-seal" data-seal="jtlw"><span class="afc-seal__text"><span class="afc-seal__name">AFC Church Portal</span><span class="afc-seal__sub">Campus</span></span></span>
  <span class="afc-topbar__spacer"></span>
  <a class="afc-btn afc-btn--ghost" href="./sync-settings.html">Sync queue</a>
</header>

<main id="main" class="afc-container" style="max-width:44rem">
  <p class="afc-label">Campus groups</p>
  <h1 class="afc-h2">Campus fellowships</h1>

  <!-- Groups added on this device, newest first. Device-local only. -->
  <section aria-labelledby="groups-list-title" data-list-wrap hidden>
    <h2 class="afc-h4" id="groups-list-title">Groups on this device</h2>
    <ul class="afc-stack afc-stack--sm" data-list style="list-style:none;margin:0;padding:0"></ul>
  </section>

  <!-- P4 first-run empty (AFC-956 P4, verbatim copy). ONE primary CTA.
       No Portal group-create flow exists yet, so the CTA opens the
       device-local create form below — never a dead end, nothing leaves
       this device. -->
  <section class="afc-empty" aria-labelledby="campus-empty-title" data-empty>
    <span class="afc-empty__mark" aria-hidden="true"></span>
    <p class="afc-empty__title" id="campus-empty-title">Support campus fellowships — no groups set up yet.</p>
    <div class="afc-empty__actions">
      <button class="afc-btn afc-btn--primary" type="button" data-create-toggle aria-expanded="false" aria-controls="campus-create">Add first group</button>
    </div>
  </section>

  <section class="afc-card" id="campus-create" data-create hidden aria-labelledby="campus-create-title" style="margin-top:var(--afc-space-6)">
    <div class="afc-card__head">
      <p class="afc-label" style="margin:0">New campus group</p>
    </div>
    <div class="afc-card__body">
      <h2 class="afc-h4" id="campus-create-title" style="margin-top:0">Add a fellowship group</h2>
      <form data-form>
        <div class="afc-field">
          <label class="afc-field__label" for="group-name">Group name</label>
          <input class="afc-input" id="group-name" name="name" type="text" autocomplete="off" required placeholder="e.g. Main Campus Fellowship" />
        </div>
        <div class="afc-field">
          <label class="afc-field__label" for="group-day">Meeting day <span class="afc-field__optional">optional</span></label>
          <input class="afc-input" id="group-day" name="day" type="text" autocomplete="off" placeholder="e.g. Thursdays" />
        </div>
        <div class="afc-row" style="margin-top:var(--afc-space-4)">
          <button class="afc-btn afc-btn--primary" type="submit">Save group</button>
        </div>
      </form>
      <p class="afc-meta" style="margin-top:var(--afc-space-3)">Stays on this device. No member or children data — group names only.</p>
    </div>
  </section>
</main>

<script>
(function () {
  var KEY = 'afc:campus-groups:v1';
  var empty = document.querySelector('[data-empty]');
  var create = document.querySelector('[data-create]');
  var toggle = document.querySelector('[data-create-toggle]');
  var form = document.querySelector('[data-form]');
  var listWrap = document.querySelector('[data-list-wrap]');
  var list = document.querySelector('[data-list]');

  function read() {
    try { return JSON.parse(localStorage.getItem(KEY) || '[]'); }
    catch (_e) { return []; }
  }
  function write(rows) {
    try { localStorage.setItem(KEY, JSON.stringify(rows)); } catch (_e) {}
  }
  function paint() {
    var rows = read();
    list.innerHTML = '';
    rows.forEach(function (g) {
      var li = document.createElement('li');
      li.className = 'afc-card';
      var name = document.createElement('p');
      name.className = 'afc-empty__title';
      name.style.margin = '0';
      name.textContent = g.name;
      li.appendChild(name);
      if (g.day) {
        var meta = document.createElement('p');
        meta.className = 'afc-meta';
        meta.style.margin = 'var(--afc-space-1) 0 0';
        meta.textContent = g.day;
        li.appendChild(meta);
      }
      list.appendChild(li);
    });
    var has = rows.length > 0;
    listWrap.hidden = !has;
    empty.hidden = has;
    if (has && !create.hasAttribute('hidden')) { create.setAttribute('hidden', ''); toggle.setAttribute('aria-expanded', 'false'); }
  }
  toggle.addEventListener('click', function () {
    var open = create.hasAttribute('hidden');
    if (open) { create.removeAttribute('hidden'); document.getElementById('group-name').focus(); }
    else { create.setAttribute('hidden', ''); }
    toggle.setAttribute('aria-expanded', String(open));
  });
  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var name = form.name.value.trim();
    if (!name) return;
    var rows = read();
    rows.unshift({ name: name, day: form.day.value.trim() });
    write(rows);
    form.reset();
    paint();
  });
  paint();
})();
</script>
</body>
</html>
